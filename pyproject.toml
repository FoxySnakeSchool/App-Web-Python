[project]
name = "awp-gabarit"
version = "0.1.0"
description = "CODA Orléans, M2-D : Applications web de données avec Python"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "dash[cloud]>=4.5.0",
    "dash-ag-grid>=35.3.0",
    "dash-bootstrap-components>=2.0.4",
    "dash-leaflet>=1.1,<2",
    "diskcache>=5.6",
    "fastapi>=0.163.1",
    "flask-caching>=2.3,<3",
    "joblib>=1.6.0",
    "mcp>=1.30,<2",
    "multiprocess>=0.70",
    "openai>=3.52.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "psutil>=5.9",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.11",
    "streamlit>=1.67.0",
    "threadpoolctl>=3.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.5"]

[tool.pytest.ini_options]
pythonpath = [".", "fil_rouge"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["data", "figures"]
